name: Build & Deploy to Hostinger (DEV ring)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL_DEV }}
          NUXT_PUBLIC_ALLOW_YOUTUBE: ${{ vars.ALLOW_YOUTUBE_DEV }}

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_DEV }}
          username: ${{ secrets.FTP_USERNAME_DEV }}
          password: ${{ secrets.FTP_PASSWORD_DEV }}
          local-dir: ./.output/public/
          server-dir: ./